apiVersion: greenhouse.sap/v1alpha1
kind: ClusterPluginDefinition
metadata:
  name: dashboard
spec:
  displayName: Dashboard
  description: >-
    Greenhouse dashboard — the web UI for viewing and managing the Greenhouse platform.
  version: "0.3.0"
  helmChart:
    name: dashboard
    repository: oci://ghcr.io/cloudoperators/greenhouse-helm/charts
    version: 0.3.0
  options:
    - name: global.dnsDomain
      displayName: DNS domain
      description: Base DNS domain for this Greenhouse installation; the dashboard is exposed under this domain.
      required: true
      type: string
    - name: dashboard.assetServerURL
      displayName: Asset server URL
      description: URL of the Juno asset server from which the dashboard frontend assets are loaded.
      required: true
      default: origin
      type: string
    - name: ingress.className
      displayName: Ingress class name
      description: IngressClass used to expose the dashboard.
      required: true
      type: string
    - name: dashboard.authClientId
      displayName: OIDC client ID
      description: OIDC client ID the dashboard SPA uses to authenticate users against the Greenhouse auth proxy.
      required: false
      default: greenhouse
      type: string
    - name: dashboard.corsProxy.enabled
      displayName: Gateway CORS proxy
      description: Expose the Kubernetes API server through the gateway with CORS headers so the dashboard can call the API from the browser.
      required: false
      default: "true"
      type: bool
    - name: dashboard.corsProxy.parentRefName
      displayName: CORS proxy parent Gateway name
      description: Name of the externally provided Gateway the cors-proxy ListenerSet attaches to. Required when the gateway CORS proxy is enabled.
      required: false
      type: string
