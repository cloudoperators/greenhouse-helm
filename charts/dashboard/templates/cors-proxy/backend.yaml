{{- if .Values.dashboard.proxy.enabled -}}
apiVersion: gateway.kgateway.dev/v1alpha1
kind: Backend
metadata:
  name: {{ include "dashboard.proxy.fullname" . }}-apiserver
  namespace: {{ .Release.Namespace }}
spec:
  type: Static
  static:
    hosts:
      - host: {{ required "global.apiserverHostname is required" .Values.global.apiserverHostname }}
        port: 443
{{- end }}
