{{- if .Values.dashboard.proxy.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: {{ include "dashboard.proxy.fullname" . }}-apiserver
  namespace: {{ .Release.Namespace }}
spec:
  targetRefs:
    - group: gateway.kgateway.dev
      kind: Backend
      name: {{ include "dashboard.proxy.fullname" . }}-apiserver
  validation:
    hostname: {{ required "global.apiserverHostname is required" .Values.global.apiserverHostname }}
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: kube-root-ca.crt
{{- end }}
