{{- if .Values.dashboard.proxy.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: {{ include "dashboard.proxy.fullname" . }}
  namespace: {{ .Release.Namespace }}
  {{- with .Values.dashboard.proxy.listenerSetAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ required "global.gateway.name is required (the externally provided Gateway to attach to)" .Values.global.gateway.name }}
    {{- with .Values.global.gateway.namespace }}
    namespace: {{ . }}
    {{- end }}
  listeners:
    - name: https-cors-proxy
      protocol: HTTPS
      port: 443
      hostname: {{ include "dashboard.api.host" . | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ .Values.dashboard.proxy.tls.secretName | default (printf "%s-tls" (include "dashboard.proxy.fullname" .)) }}
{{- end }}
