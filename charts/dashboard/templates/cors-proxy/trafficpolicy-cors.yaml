{{- if .Values.dashboard.proxy.enabled -}}
# Applies CORS headers to the API-server route so the Greenhouse dashboard can
# call the Kubernetes API from the browser, and disables the request /
# stream-idle timeouts so long-lived watches and log streams stay open.
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: {{ include "dashboard.proxy.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "dashboard.proxy.fullname" . }}
  cors:
    allowCredentials: {{ .Values.dashboard.proxy.cors.allowCredentials }}
    # The dashboard SPA origins are always allowed first: the base host and the
    # "*.<host>" wildcard (kgateway compiles the wildcard to a regex match),
    # matching the two hosts the dashboard Ingress serves. Any configured
    # allowOrigins are appended after them.
    allowOrigins:
      - {{ printf "https://%s" (include "dashboard.hostname" .) }}
      - {{ printf "https://*.%s" (include "dashboard.hostname" .) }}
      {{- with .Values.dashboard.proxy.cors.allowOrigins }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
    allowMethods:
      {{- toYaml .Values.dashboard.proxy.cors.allowMethods | nindent 6 }}
    allowHeaders:
      {{- toYaml .Values.dashboard.proxy.cors.allowHeaders | nindent 6 }}
    exposeHeaders:
      {{- toYaml .Values.dashboard.proxy.cors.exposeHeaders | nindent 6 }}
    maxAge: {{ .Values.dashboard.proxy.cors.maxAge }}
  {{- with .Values.dashboard.proxy.timeouts }}
  timeouts:
    {{- with .request }}
    request: {{ . | quote }}
    {{- end }}
    {{- with .streamIdle }}
    streamIdle: {{ . | quote }}
    {{- end }}
  {{- end }}
{{- end }}
