{{- if .Values.dashboard.gateway.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "dashboard.gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  {{- with .Values.dashboard.gateway.httpRouteAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: {{ include "dashboard.gateway.fullname" . }}
  hostnames:
    - {{ include "dashboard.hostname" . | quote }}
    - {{ printf "*.%s" (include "dashboard.hostname" .) | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - kind: Service
          name: {{ include "dashboard.fullname" . }}
          port: 80
{{- end }}
