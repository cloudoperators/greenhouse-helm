global:
  dnsDomain: ""
  # -- Sub-domain for the Kubernetes API hostname (<kubeAPISubDomain>.<dnsDomain>). Empty defaults to "api".
  kubeAPISubDomain: ""

image:
  repository: ghcr.io/cloudoperators/juno-app-greenhouse
  # Overrides the image tag to use a specific digest instead
  digest: sha256:ae366951d37198d05d6b3d5859dec8181530d380ea7b9a8a8cfc5a8f07937631
  pullPolicy: IfNotPresent

replicas: 2

ingress:
  className: nginx

dashboard:
  assetServerURL: origin
  # OIDC client ID the dashboard SPA uses against the Greenhouse auth proxy (idproxy/dex).
  authClientId: greenhouse
  # Hostname overrides. Each is a bare host; when unset it is derived from global.dnsDomain
  # (dashboard.<dnsDomain>, auth.<dnsDomain>, api.<dnsDomain>).
  # hostname: ""
  # authHostname: ""
  # apiHostname: ""
  # The user for demonstration purposes.
  demoUser:
    token: demo
