global:
  dnsDomain: ""
  oidc:
    clientID: ""

image:
  repository: ghcr.io/cloudoperators/juno-app-greenhouse
  # Overrides the image tag to use a specific digest instead
  digest: sha256:ae366951d37198d05d6b3d5859dec8181530d380ea7b9a8a8cfc5a8f07937631
  pullPolicy: IfNotPresent

replicas: 2

ingress:
  className: nginx

dashboard:
  assetServerURL: origin

  # The user for demonstration purposes.
  demoUser:
    token: demo

# Bundled CORS proxy that fronts the Kubernetes API for the dashboard.
cors:
  replicaCount: 2

  image:
    repository: ghcr.io/cloudoperators/greenhouse
    # Tag is required; populated by the greenhouse image-tag dispatch workflow.
    tag: ""
    # Overrides the image tag to use a specific digest instead
    # digest: ""
    pullPolicy: IfNotPresent

  imagePullSecrets: []

  serviceAccount:
    create: false
    annotations: {}
    name: ""

  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}

  service:
    type: ClusterIP
    port: 80

  ingress:
    enabled: true
    className: "nginx"
    annotations: {}
    tls: true

  resources: {}

  nodeSelector: {}
  tolerations: []
