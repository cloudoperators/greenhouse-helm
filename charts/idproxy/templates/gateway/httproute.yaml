{{- if .Values.gateway.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "idproxy.gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "idproxy.labels" . | nindent 4 }}
  {{- with .Values.gateway.httpRouteAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: {{ include "idproxy.gateway.fullname" . }}
      sectionName: https
  hostnames:
    - {{ include "idproxy.auth.hostname" . | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - kind: Service
          name: {{ include "idproxy.fullname" . }}
          port: {{ .Values.service.port }}
{{- end }}
