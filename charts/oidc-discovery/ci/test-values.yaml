# ct install/lint values for the oidc-discovery chart.
# Supplies the required global.dnsDomain and the discovery server's required
# parent Gateway reference.
global:
  dnsDomain: example.com
  gateway:
    name: greenhouse-gateway

discovery:
  enabled: true
  apiserverHostname: kubernetes.default.svc
