nameOverride: ""
fullnameOverride: ""

# Global values shared across all Greenhouse charts in an umbrella deployment.
global:
  # Base DNS domain for this Greenhouse installation (e.g. "greenhouse.example.com").
  dnsDomain: ""
  # Externally provided Gateway that the discovery ListenerSet attaches to.
  # Shared across the Greenhouse charts that expose services through the gateway.
  gateway:
    name: ""
    namespace: ""

# API-server OIDC discovery server. Exposes the Kubernetes discovery endpoints
# (/.well-known/openid-configuration and /openid/v1/jwks) through an externally
# provided Gateway.
discovery:
  # Deploy the discovery server resources.
  enabled: true
  # Subdomain for the exposed hostname (combined with global.dnsDomain),
  # consistent with the other Greenhouse charts (idproxy "auth", cors-proxy "api").
  subDomain: "discovery"
  # Full hostname at which the discovery endpoints are exposed.
  # Overrides subDomain when set. Defaults to "<subDomain>.<global.dnsDomain>".
  hostname: ""
  # Hostname of the API server used as the static Backend target.
  apiserverHostname: "kubernetes.default.svc"
  # Annotations placed on the ListenerSet resource (e.g. cert-manager issuer).
  listenerSetAnnotations: {}
  # Annotations placed on the HTTPRoute resource (e.g. external-dns).
  httpRouteAnnotations: {}
  # TLS certificate Secret name for the HTTPS listener.
  # Defaults to <fullname>-tls; cert-manager will create the Secret at this name.
  tls:
    secretName: ""
