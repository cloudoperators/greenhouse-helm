{{- if .Values.organization.enabled }}
{{- $admin := .Values.organization.adminTeam | default dict }}
apiVersion: greenhouse.sap/v1alpha1
kind: Team
metadata:
  name: admin
  namespace: {{ .Release.Namespace }}
{{- if $admin.isSupportGroup }}
  labels:
    greenhouse.sap/support-group: "true"
{{- end }}
spec:
  description: {{ $admin.description | default "Greenhouse Admin Team" }}
  mappedIdPGroup: {{ required "organization.mappedOrgAdminIdPGroup is required" .Values.organization.mappedOrgAdminIdPGroup }}
{{- range $teamName, $team := .Values.organization.additionalTeams }}
---
apiVersion: greenhouse.sap/v1alpha1
kind: Team
metadata:
  name: {{ required "Team name missing" $teamName | lower }}
  namespace: {{ $.Release.Namespace }}
{{- if $team.isSupportGroup }}
  labels:
    greenhouse.sap/support-group: "true"
{{- end }}
spec:
  description: {{ $team.description | default (printf "Team %s" $teamName) }}
  mappedIdPGroup: {{ required "Team mappedIdPGroup is missing" $team.mappedIdPGroup }}
{{- end }}
{{- end }}