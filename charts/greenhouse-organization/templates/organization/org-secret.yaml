{{- if or .Values.organization.oidc.enabled .Values.organization.scim.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Namespace }}-auth
  namespace: {{ .Release.Namespace }}
type: greenhouse.sap/orgsecret
data:
{{- if .Values.organization.oidc.enabled }}
  oidcClientID: {{ required ".Values.organization.oidc.clientID missing" .Values.organization.oidc.clientID | b64enc }}
  oidcClientSecret: {{ required ".Values.organization.oidc.clientSecret missing" .Values.organization.oidc.clientSecret | b64enc }}
{{ end }}
{{- if .Values.organization.scim.enabled }}
{{- if eq (.Values.organization.scim.authType | default "basic") "token" }}
  scimBearerToken: {{ required ".Values.organization.scim.bearerToken is required when scim.authType is token" .Values.organization.scim.bearerToken | b64enc }}
{{- else }}
  scimBasicAuthUser: {{ required ".Values.organization.scim.username is required when scim.authType is basic" .Values.organization.scim.username | b64enc }}
  scimBasicAuthPassword: {{ required ".Values.organization.scim.password is required when scim.authType is basic" .Values.organization.scim.password | b64enc }}
{{- end }}
{{ end }}
{{ end }}