{{- if and .Values.fluxAlerts .Values.fluxAlerts.enabled }}
{{- $alerts := .Values.fluxAlerts }}
{{- range $path, $bytes := .Files.Glob "alerts/*.alerts" }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ printf "%s-%s" ($.Release.Name) (trimPrefix "alerts/" $path) | replace "." "-"}}
  {{- with $alerts.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $alerts.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
{{ printf "%s" $bytes | indent 2 }}
{{- end }}
{{- end }}
