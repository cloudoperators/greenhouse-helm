global:
  dnsDomain: green.house
  dex:
    backend: postgres
    postgresql:
      postgresqlDatabase: dex
      postgresqlPort: 5432
      postgresqlUsername: dex
  plugin:
    ociMirroringEnabled: false
  pluginPreset:
    expressionEvaluationEnabled: true
    integrationEnabled: true
  workloadIdentity:
    enabled: false

controllerManager:
  args:
    foo: bar

alerts:
  enabled: true
  commonAlertLabels:
    foo: bar
    cluster: test

cors:
  enabled: true

catalogs:
  greenhouse-system-components:
    sources:
      - repository: https://github.com/cloudoperators/greenhouse-helm
        ref:
          branch: main
        resources:
          - charts/dashboard/plugindefinition.yaml
          - charts/greenhouse-gateway/plugindefinition.yaml
          - charts/idproxy/plugindefinition.yaml
          - charts/oidc-discovery/plugindefinition.yaml
