{{- if and .Values.cors.enabled .Values.cors.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ default (printf "%s-cors-proxy" (include "manager.fullname" .)) .Values.cors.serviceAccount.name }}
  labels:
    app.kubernetes.io/name: cors-proxy
    app.kubernetes.io/instance: {{ .Release.Name }}
  {{- with .Values.cors.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}