{{- if .Values.cors.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "manager.fullname" . }}-cors-proxy
  labels:
    app.kubernetes.io/name: cors-proxy
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ .Values.cors.service.type }}
  ports:
    - port: {{ .Values.cors.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: 6543
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    app.kubernetes.io/name: cors-proxy
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}