apiVersion: greenhouse.sap/v1alpha1
kind: ClusterPluginDefinition
metadata:
  name: greenhouse-gateway
spec:
  displayName: Greenhouse Gateway
  description: A plugin definition for the Greenhouse Kubernetes API Gateway.
  version: "0.1.3"
  helmChart:
    name: greenhouse-gateway
    repository: oci://ghcr.io/cloudoperators/greenhouse-helm/charts
    version: 0.1.3
  options:
    - name: global.gateway.name
      displayName: Gateway name
      description: Name of the Gateway resource this chart creates. Consumers reference the same value as their parentRef. When empty, the chart's fullname is used.
      required: false
      type: string
