apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "gateway.resourceName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
  {{- with .Values.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  gatewayClassName: kgateway
  {{- with .Values.address }}
  addresses:
    - type: IPAddress
      value: {{ . | quote }}
  {{- end }}
  allowedListeners:
    namespaces:
      {{- include "gateway.allowedNamespaces" . | nindent 6 }}
  # The Gateway API requires at least one listener on the Gateway itself.
  # This base HTTP :80 listener satisfies that requirement.
  listeners:
    {{- if .Values.listeners }}
    {{- toYaml .Values.listeners | nindent 4 }}
    {{- else }}
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
  {{- $gp := .Values.gatewayParameters | default dict }}
  {{- $gpEnabled := and $gp.enabled $gp.kube }}
  {{- if or .Values.infrastructure.annotations $gpEnabled }}
  infrastructure:
    {{- with .Values.infrastructure.annotations }}
    annotations:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- if $gpEnabled }}
    # kgateway reads proxy config (HPA, deployment, service, ...) from this GatewayParameters.
    parametersRef:
      group: gateway.kgateway.dev
      kind: GatewayParameters
      name: {{ include "gateway.resourceName" . }}
    {{- end }}
  {{- end }}
  