# Default values for gateway.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

nameOverride: ""
fullnameOverride: ""

# Optional static IP address requested for the Gateway.
# If unset, the implementation assigns an address automatically.
address: ""

# Annotations applied to the Gateway resource
annotations: {}
  # cert-manager.io/issuer: letsencrypt-issuer

# Infrastructure-level configuration applied to the underlying load balancer / proxy
infrastructure:
  annotations: {}
    # external-dns.kubernetes.io/target: ingress.example.tld

# Passed through verbatim as the Gateway's spec.allowedListeners. Controls which ListenerSets
# may attach to this Gateway. The default below allows ListenerSets from the same namespace;
# Override the whole block to use a selector or widen/narrow the scope.
allowedListeners:
  namespaces:
    from: Same   # Same | All | Selector | None
    # selector:
    #   matchLabels:
    #     kubernetes.io/metadata.name: some-namespace

# Listeners define the ports and protocols the Gateway accepts traffic on.
# If empty, a base HTTP :80 listener is created to satisfy the Gateway API
# requirement of at least one listener.
listeners: []
# - name: https-wildcard
#   hostname: "*.example.tld"
#   port: 443
#   protocol: HTTPS
#   tls:
#     mode: Terminate
#     certificateRefs:
#     - kind: Secret
#       name: gateway-wildcard-tls
#   allowedRoutes:
#     namespaces:
#       from: Same   # Same | All | Selector

# kgateway-specific proxy configuration, rendered as a GatewayParameters resource
# and referenced from the Gateway via spec.infrastructure.parametersRef.
# The `kube` block is passed through verbatim to spec.kube, so any field
# supported by kgateway can be set here.
# See: https://kgateway.dev/docs/envoy/latest/setup/customize/configs/
gatewayParameters:
  enabled: false
  kube: {}
    # horizontalPodAutoscaler:
    #   spec:
    #     minReplicas: 2
    #     maxReplicas: 5
    #     metrics:
    #       - type: Resource
    #         resource:
    #           name: cpu
    #           target:
    #             type: Utilization
    #             averageUtilization: 80
    # service:
    #   type: LoadBalancer
    # deployment:
    #   strategy:
    #     type: RollingUpdate

# Arbitrary extra manifests to render alongside the chart's own resources. Each
# list entry is emitted verbatim as its own object (rendered through tpl, so it
# may use {{ .Release.Namespace }} etc.). The chart does not interpret or wire
# these up in any way. A common use is an image pull Secret for a custom gateway
# proxy image, which you then reference yourself from
# gatewayParameters.kube.podTemplate.imagePullSecrets.
extraObjects: []
  # Image pull Secret whose credentials are resolved in-cluster by secrets-injector.
  # Non-obvious requirements (all load-bearing):
  #   * type kubernetes.io/dockerconfigjson is on the injector's default ignore
  #     list, so it MUST carry cloud.sap/inject-secrets: "true" to opt back in.
  #   * The injector only runs {{ resolve }} templating on the decoded `data` value,
  #     so the dockerconfigjson goes under `data:` base64-encoded.
  #   * Inside resolve, the vault ref must use backticks, not double quotes.
  # The value below is the base64 of this JSON (supply it pre-encoded so the chart's
  # own tpl pass leaves the {{ resolve }} untouched for the injector to evaluate):
  #   {"auths":{"my-registry.example.com":{
  #     "username":"{{ resolve `vault+kvv2:///secrets/path/to/registry/username` }}",
  #     "password":"{{ resolve `vault+kvv2:///secrets/path/to/registry/password` }}"}}}
  # - apiVersion: v1
  #   kind: Secret
  #   metadata:
  #     name: gateway-registry-creds
  #     annotations:
  #       cloud.sap/inject-secrets: "true"
  #   type: kubernetes.io/dockerconfigjson
  #   data:
  #     .dockerconfigjson: eyJhdXRocyI6eyJteS1yZWdpc3RyeS5leGFtcGxlLmNvbSI6eyJ1c2VybmFtZSI6Int7IHJlc29sdmUgYHZhdWx0K2t2djI6Ly8vc2VjcmV0cy9wYXRoL3RvL3JlZ2lzdHJ5L3VzZXJuYW1lYCB9fSIsInBhc3N3b3JkIjoie3sgcmVzb2x2ZSBgdmF1bHQra3Z2MjovLy9zZWNyZXRzL3BhdGgvdG8vcmVnaXN0cnkvcGFzc3dvcmRgIH19In19fQ==

global:
  gateway:
    # Name of the Gateway resource this chart creates. When set, consumers
    # (dashboard, cors-proxy, oidc-discovery) reference the same value as their
    # parentRef, so one value names the Gateway and points every ListenerSet at it.
    # When empty, the name falls back to the chart's fullname.
    name: ""
