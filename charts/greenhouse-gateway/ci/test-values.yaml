global:
  dnsDomain: example.tld

annotations:
  cert-manager.io/issuer: letsencrypt-issuer

infrastructure:
  annotations:
    external-dns.kubernetes.io/target: ingress.example.tld

allowedListeners:
  from: Same

listeners:
  - name: https-wildcard
    hostname: "*.example.tld"
    port: 443
    protocol: HTTPS
    tls:
      mode: Terminate
      certificateRefs:
        - kind: Secret
          name: gateway-wildcard-tls
    allowedRoutes:
      namespaces:
        from: Same

gatewayParameters:
  enabled: true
  kube:
    horizontalPodAutoscaler:
      spec:
        minReplicas: 2
        maxReplicas: 5
        metrics:
          - type: Resource
            resource:
              name: cpu
              target:
                type: Utilization
                averageUtilization: 80
    service:
      type: LoadBalancer
