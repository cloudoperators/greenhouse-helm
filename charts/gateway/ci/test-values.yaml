# ct install/lint values for the gateway chart.
# Supplies the required global.dnsDomain and exercises the central Gateway
# together with the OIDC discovery server.
global:
  dnsDomain: example.com

gateway:
  enabled: true
  className: kgateway

discovery:
  enabled: true
  apiserverHostname: kubernetes.default.svc
