{{- if and .Values.gateway.enabled (.Capabilities.APIVersions.Has "gateway.networking.k8s.io/v1") -}}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "gateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  gatewayClassName: {{ required "gateway.className is required when gateway.enabled=true" .Values.gateway.className }}
  {{- with .Values.gateway.address }}
  addresses:
    - type: IPAddress
      value: {{ . | quote }}
  {{- end }}
  allowedListeners:
    namespaces:
      {{- include "gateway.allowedNamespaces" . | nindent 6 }}
  # The Gateway API requires at least one listener on the Gateway itself.
  # This base HTTP :80 listener satisfies that requirement.
  listeners:
    {{- if .Values.gateway.listeners }}
    {{- toYaml .Values.gateway.listeners | nindent 4 }}
    {{- else }}
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
  {{- $hpaEnabled := include "gateway.hpaEnabled" . }}
  {{- if or .Values.gateway.infrastructureAnnotations $hpaEnabled }}
  infrastructure:
    {{- with .Values.gateway.infrastructureAnnotations }}
    annotations:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- if $hpaEnabled }}
    # kgateway reads HPA config from this GatewayParameters resource.
    parametersRef:
      group: gateway.kgateway.dev
      kind: GatewayParameters
      name: {{ include "gateway.fullname" . }}
    {{- end }}
  {{- end }}
{{- end }}
