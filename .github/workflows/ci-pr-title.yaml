name: "PR title"
on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions:
  pull-requests: read

jobs:
  validate-pr-title:
    runs-on: [ ubuntu-latest ]
    steps:
      # Validate that the PR title follows conventional commits
      # (<type>(<scope>): description). The title becomes the squash-merge
      # commit subject, so this keeps the main history consistent.
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Accepted conventional-commit types. Scope is optional and
          # unrestricted (typically the affected chart, e.g. gateway, manager).
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
